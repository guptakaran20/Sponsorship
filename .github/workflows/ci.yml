name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-lint-build:
    name: Backend Lint & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CSRF_SECRET: ${{ secrets.CSRF_SECRET }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}

      - name: Run tests
        run: npm test
        env:
          JWT_SECRET: test-secret-key-that-is-at-least-32-chars-long
          JWT_REFRESH_SECRET: test-refresh-secret-key-that-is-at-least-32-chars
          JWT_EXPIRES_IN: 15m
          JWT_REFRESH_EXPIRES_IN: 7d
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sponsorbridge
          ADMIN_SECRET: test-admin-secret
          CSRF_SECRET: test-csrf-secret-key-that-is-at-least-32-chars
          CORS_ORIGIN: http://localhost:3000

      - name: Build
        run: npm run build
        env:
          JWT_SECRET: test-secret-key-that-is-at-least-32-chars-long
          JWT_REFRESH_SECRET: test-refresh-secret-key-that-is-at-least-32-chars
          JWT_EXPIRES_IN: 15m
          JWT_REFRESH_EXPIRES_IN: 7d
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sponsorbridge
          ADMIN_SECRET: test-admin-secret
          CSRF_SECRET: test-csrf-secret-key-that-is-at-least-32-chars
          CORS_ORIGIN: http://localhost:3000

  frontend-lint-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint || true

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000/api
